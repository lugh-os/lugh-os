# Build the live ISO in the Debian trixie build container and boot-test it
# in QEMU (UEFI, UEFI + Secure Boot, legacy BIOS). Records ISO size, build
# time and boot times in the job summary (docs/phases/phase-0-foundation.md §7).
name: iso

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # live-build needs real root for debootstrap (mknod, mounts); rootless
  # podman cannot do that, so CI uses the runner's rootful docker.
  CONTAINER_ENGINE: docker
  # Phase 0 budget: ISO <= 1.2 GB (decimal).
  ISO_MAX_BYTES: "1200000000"

jobs:
  iso:
    name: build + boot test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::/dev/kvm missing; boot tests fall back to TCG"

      - name: Restore live-build package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iso/cache/
          key: lb-cache-${{ runner.os }}-${{ hashFiles('iso/config/package-lists/**', 'iso/auto/config') }}
          restore-keys: |
            lb-cache-${{ runner.os }}-

      - name: Build debs, repo and ISO
        env:
          LUGH_REPO_GPG_KEY: ${{ secrets.LUGH_REPO_GPG_KEY }}
        run: |
          start=$(date +%s)
          make debs repo iso
          end=$(date +%s)
          echo "BUILD_SECONDS=$((end - start))" >> "$GITHUB_ENV"
          ls -l out/

      # The cache is written as root inside the container; make it readable
      # for the post-job cache save.
      - name: Fix cache ownership
        if: always()
        run: |
          if [ -d iso/cache ]; then sudo chown -R "$(id -u):$(id -g)" iso/cache; fi

      - name: Record ISO size
        run: |
          iso=$(readlink -f out/lugh.iso)
          echo "ISO_PATH=$iso" >> "$GITHUB_ENV"
          echo "ISO_SIZE=$(stat -c %s "$iso")" >> "$GITHUB_ENV"

      - name: Upload ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lugh-iso-${{ github.sha }}
          path: |
            out/lugh-*-amd64.iso
            out/lugh-*-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Boot test (UEFI, UEFI + Secure Boot, BIOS)
        run: make test-boot

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Lugh ISO"
            echo
            echo "| Metric | Value | Budget |"
            echo "|---|---|---|"
            if [ -n "${ISO_SIZE:-}" ]; then
              echo "| ISO size | $(awk -v b="$ISO_SIZE" 'BEGIN { printf "%.3f GB (%d bytes)", b / 1e9, b }') | ≤ 1.2 GB |"
            else
              echo "| ISO size | n/a (build failed) | ≤ 1.2 GB |"
            fi
            if [ -n "${BUILD_SECONDS:-}" ]; then
              echo "| Build time (debs + repo + ISO) | $((BUILD_SECONDS / 60)) min $((BUILD_SECONDS % 60)) s | ≤ 20 min (warm cache) |"
            fi
            if [ -f out/boot-times.json ]; then
              jq -r '.accel as $a | .results[] |
                "| Boot to marker, \(.mode) (\($a)) | \(if .status == "pass" then "\(.seconds) s" else "**\(.status)**" end) | \(if .mode == "uefi" then "≤ 25 s" else "—" end) |"' \
                out/boot-times.json
            else
              echo "| Boot test | not run | — |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-logs-${{ github.sha }}
          path: |
            out/serial-*.log
            out/qemu-*.log
            out/boot-times.json
            iso/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload boot times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-times-${{ github.sha }}
          path: out/boot-times.json
          if-no-files-found: ignore
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

      # Last, so an oversized ISO is still uploaded and boot-tested.
      - name: Enforce ISO size budget
        run: |
          if [ "$ISO_SIZE" -gt "$ISO_MAX_BYTES" ]; then
            echo "::error::ISO is $ISO_SIZE bytes, over the ${ISO_MAX_BYTES}-byte (1.2 GB) budget"
            exit 1
          fi
          echo "ISO size $ISO_SIZE bytes is within budget"
