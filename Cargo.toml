[workspace]
resolver = "3"
members = ["crates/*"]
# The cxx-qt smoke app is a separate cargo project, built only where Qt 6 is installed.
exclude = ["ui/hello"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/lugh-os/lugh-os"
publish = false

[workspace.dependencies]
lugh-common = { path = "crates/lugh-common" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
# zbus on the tokio runtime (no async-io executor of its own).
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false }

# dev
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
