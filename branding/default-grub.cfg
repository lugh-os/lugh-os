# Lugh GRUB defaults. Installed by lugh-branding as
# /etc/default/grub.d/lugh.cfg; grub-mkconfig (update-grub) reads it after
# /etc/default/grub, so these values win.
GRUB_DISTRIBUTOR="Lugh"
GRUB_THEME=/usr/share/grub/themes/lugh/theme.txt
GRUB_GFXMODE=auto
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
