[package]
name = "lugh-shell-devd"
description = "Development server: one lugh-shell ShellCore behind a loopback WebSocket, so the QML preview drives the real services of the dev machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lugh-common.workspace = true
lugh-shell-core = { path = "../lugh-shell-core" }
serde_json = "1"
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "net", "sync", "macros", "signal", "time"] }
# Plain ws:// only: no TLS, no client.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake", "connect"] }

[lints]
workspace = true
