# Lugh live ISO: GRUB settings (UEFI; BIOS boots through ISOLINUX).
# Overrides live-build's template: short timeout instead of waiting forever,
# no start-up beep, Lugh theme, and the menu mirrored to the serial port.
set default=0
set timeout=3
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=1024x768,800x600,auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

if serial --unit=0 --speed=115200 ; then
    terminal_input --append serial
    terminal_output --append serial
fi
