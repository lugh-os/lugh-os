# Lugh colours for text mode; the graphical theme is branding/grub/, staged
# into live-theme/ by scripts/build-iso.sh.
set color_normal=black/light-gray
set color_highlight=black/yellow
set menu_color_normal=black/light-gray
set menu_color_highlight=black/yellow

# config.cfg has already loaded unicode.pf2 ("GNU Unifont Regular 16", the
# theme's terminal font). The theme's Inter fonts are loaded by name.
# Under Secure Boot (lockdown=y) the signed GRUB refuses unsigned font files
# ("prohibited by secure boot policy"), so skip them there: the theme then
# falls back to Unifont.
if [ -e /boot/grub/live-theme/theme.txt ]; then
    if [ x$lockdown != xy ]; then
        for f in inter-regular-16 inter-regular-24 inter-semibold-24 ; do
            if [ -e /boot/grub/live-theme/$f.pf2 ]; then
                loadfont /boot/grub/live-theme/$f.pf2
            fi
        done
    fi
    set theme=/boot/grub/live-theme/theme.txt
    export theme
fi
