[package]
name = "lugh-greeter"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false
description = "The Lugh sign-in screen: a QML app run by greetd inside cage. Talks to greetd through crates/lugh-greetd."

# Standalone project like ui/hello: it needs the Qt 6 dev packages, so it stays
# out of the root workspace. Build it with scripts/build-greeter.sh.
[workspace]

[features]
default = []
# Compiles in LUGH_GREETER_AUTOTEST=user:password, which logs in without a
# person (end-to-end check). Never enable it in a shipped binary.
test-hooks = []

[dependencies]
lugh-greetd = { path = "../../crates/lugh-greetd" }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
