# xdg-desktop-portal backends for the Lugh session (ADR-020).
# Installed as /usr/share/xdg-desktop-portal/lugh-portals.conf
# (xdg-desktop-portal reads <desktop>-portals.conf for each entry of
#  XDG_CURRENT_DESKTOP, lowercased: "Lugh:Hyprland" -> lugh-portals.conf first).
#
# Phases 1-4: xdg-desktop-portal-hyprland for what needs the compositor
# (screen cast, screenshot, global shortcuts), xdg-desktop-portal-gtk for the
# rest (file chooser, settings/appearance, app chooser, print, ...).
# Phase 5 replaces both with xdg-desktop-portal-lugh.

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
# Secrets: gnome-keyring (ADR-020).
org.freedesktop.impl.portal.Secret=gnome-keyring
