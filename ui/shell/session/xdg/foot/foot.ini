# foot: Lugh defaults (everything else is foot's default, see foot.ini(5)).
#
# System-wide: /usr/share/lugh/xdg/foot/foot.ini, found through
# XDG_CONFIG_DIRS (set by lugh-session) when the user has no
# ~/.config/foot/foot.ini of their own. A user file replaces this one.

[csd]
# Server-side: the Lugh title bar (lugh-hyprbars, 26 px, theme colours,
# minimize/maximize/close on the right) like every other app without its own.
# With preferred=client foot draws its own bar instead (Lugh honours that too);
# the values below style it.
preferred=server
size=26
button-width=30
hide-when-maximized=no
double-click-to-maximize=yes
