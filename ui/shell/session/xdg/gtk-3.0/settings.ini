# Lugh defaults for GTK 3, system-wide: /usr/share/lugh/xdg/gtk-3.0/, found
# through XDG_CONFIG_DIRS (set by lugh-session); a user settings.ini wins.
# Fallback only: inside a Lugh session the button layout comes from gsettings
# org.gnome.desktop.wm.preferences button-layout (the Settings portal).
[Settings]
gtk-decoration-layout=appmenu:minimize,maximize,close
